name: Module 6B - Caching Demo

on: [push, workflow_dispatch]

jobs:
  cache-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Dummy Dependency Directory
        run: |
          mkdir -p .cache-deps
          echo "cached-content-version-1" > .cache-deps/dependency.txt

      - name: Cache Dependency Directory
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: .cache-deps
          key: ${{ runner.os }}-deps-${{ hashFiles('**/.cache-deps/dependency.txt') }}

      - name: Verify Cache Status
        run: |
          echo "Cache hit status: ${{ steps.cache-deps.outputs.cache-hit }}"
          if [ "${{ steps.cache-deps.outputs.cache-hit }}" == "true" ]; then
            echo "Cache was restored successfully!"
          else
            echo "Cache was saved for the next run!"
          fi
