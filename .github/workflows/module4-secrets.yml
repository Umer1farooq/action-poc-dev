name: Module 4 - Secrets and Variables

on: [push]

jobs:
  secure-data-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Access Repository Variables and Secrets
        env:
          INJECTED_SECRET: ${{ secrets.MY_SECRET }}
          INJECTED_VAR: ${{ vars.APP_ENV }}
        run: |
          echo "Using non-sensitive repo variable APP_ENV: $INJECTED_VAR"
          echo "Accessing encrypted secret (masked automatically):"
          echo "Secret value: $INJECTED_SECRET"
