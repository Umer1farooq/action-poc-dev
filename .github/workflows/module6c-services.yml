name: Module 6C - Service Containers

on: [push, workflow_dispatch]

jobs:
  database-test:
    runs-on: ubuntu-latest

    # Define service containers running alongside the job
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test Connection to PostgreSQL Service Container
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: password
        run: |
          pg_isready -h localhost -p 5432
          psql -d testdb -c "SELECT version();"
