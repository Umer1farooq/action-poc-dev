name: Module 2A - Push and PR Triggers

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Log Event Details
        run: |
          echo "Triggered by Event: ${{ github.event_name }}"
          echo "Branch / Ref: ${{ github.ref }}"
