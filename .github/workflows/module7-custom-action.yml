name: Module 7 - Consume Custom Action

on: [push, workflow_dispatch]

jobs:
  test-custom-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run My Custom Action
        id: custom-greet
        uses: ./actions/greet-action
        with:
          username: 'Umer1farooq'

      - name: Verify Action Output
        run: |
          echo "The action output was: ${{ steps.custom-greet.outputs.greeting-message }}"
