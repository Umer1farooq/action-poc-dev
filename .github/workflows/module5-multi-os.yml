name: Module 5A - Multi-OS Runners

on: [push, workflow_dispatch]

jobs:
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ubuntu Check
        run: |
          echo "Running on Ubuntu Linux"
          uname -a

  windows-job:
    runs-on: windows-latest
    steps:
      - name: Run Windows PowerShell / Choco Check
        run: |
          Write-Host "Running on Windows Server"
          choco --version

  macos-job:
    runs-on: macos-latest
    steps:
      - name: Run macOS Swift Check
        run: |
          echo "Running on macOS"
          swift --version
